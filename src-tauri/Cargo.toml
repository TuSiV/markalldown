[package]
name = "markitdown-open"
version = "1.0.0"
description = "MarkItDown Desktop - Convert files to Markdown"
authors = ["MarkItDown"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[package.metadata.tauri-winres]
LegalCopyright = "Copyright (c) YONGZHE CHEN. All rights reserved."
FileVersion = "1.0.0.0"
CompanyName = "YONGZHE CHEN"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
