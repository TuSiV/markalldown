name: Deploy browser app to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WEB_BASE_PATH: /markalldown/
      MAD_PYTHON: python
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Install browser verification fixtures
        run: |
          python -m pip install cryptography python-docx openpyxl python-pptx Pillow reportlab
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - run: npm run build:web
      - name: Verify actual conversion, OCR, recovery and offline use under project path
        run: npm run test:web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Pages-browser-verification
          path: web-evidence/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
