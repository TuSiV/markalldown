name: Main desktop builds
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: main-desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            label: windows-x64
          - os: macos-15
            label: macos-arm64
          - os: macos-15-intel
            label: macos-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - name: Install dependencies
        run: |
          npm ci
          python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt pyinstaller psutil
      - name: Tests and frontend build
        run: |
          python -m unittest discover -s tests -v
          npm test
          python scripts/smoke_service.py --source
          npm run build
      - name: Inspect previous macOS release signature and Gatekeeper
        if: runner.os == 'macOS'
        shell: bash
        run: |
          arch=x64
          if [ "${{ matrix.label }}" = "macos-arm64" ]; then arch=aarch64; fi
          curl --fail --location --retry 3 "https://github.com/TuSiV/markalldown/releases/download/v1.1.2/MarkAllDown_1.1.2_${arch}.dmg" -o "$RUNNER_TEMP/previous.dmg"
          hdiutil verify "$RUNNER_TEMP/previous.dmg"
          mount="$RUNNER_TEMP/previous-dmg"
          mkdir -p "$mount" macos-evidence
          hdiutil attach "$RUNNER_TEMP/previous.dmg" -nobrowse -mountpoint "$mount"
          ditto "$mount/MarkAllDown.app" "$RUNNER_TEMP/Previous-MarkAllDown.app"
          hdiutil detach "$mount"
          python scripts/check_macos_bundle.py "$RUNNER_TEMP/Previous-MarkAllDown.app" --inspect-only --quarantine --report "macos-evidence/previous-${{ matrix.label }}.json"
      - name: Native sidecar and installer build
        run: python scripts/build.py --skip-install
      - name: Packaged sidecar smoke (Windows)
        if: runner.os == 'Windows'
        run: python scripts/smoke_service.py backend/dist/markalldown-server.exe
      - name: Packaged sidecar smoke (macOS)
        if: runner.os == 'macOS'
        run: python scripts/smoke_service.py backend/dist/markalldown-server
      - name: Install and smoke Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          $destination = Join-Path $env:RUNNER_TEMP 'MarkAllDown-installed'
          $process = Start-Process -FilePath $installer.FullName -ArgumentList '/S',"/D=$destination" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          $exe = Get-ChildItem $destination -Filter markalldown.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw 'Installed executable not found' }
          python scripts/smoke_desktop.py $exe.FullName
      - name: Install and smoke macOS DMG app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          dmg=$(find src-tauri/target/release/bundle/dmg -name '*.dmg' -print -quit)
          mount="$RUNNER_TEMP/markalldown-dmg"
          mkdir -p "$mount"
          hdiutil attach "$dmg" -nobrowse -mountpoint "$mount"
          ditto "$mount/MarkAllDown.app" "$RUNNER_TEMP/MarkAllDown.app"
          hdiutil detach "$mount"
          python scripts/check_macos_bundle.py "$RUNNER_TEMP/MarkAllDown.app" --version 1.2.0 --report "macos-evidence/current-${{ matrix.label }}.json"
          python scripts/smoke_desktop.py "$RUNNER_TEMP/MarkAllDown.app/Contents/MacOS/markalldown"
          python scripts/check_macos_bundle.py "$RUNNER_TEMP/MarkAllDown.app" --version 1.2.0 --quarantine --report "macos-evidence/quarantined-${{ matrix.label }}.json"
      - name: Upload macOS signature and Gatekeeper evidence
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Mac-policy-${{ matrix.label }}
          path: macos-evidence/*.json
          if-no-files-found: warn
      - name: Upload installers and smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: MarkAllDown-${{ matrix.label }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
  ui-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Prepare UI rendering
        run: |
          npm ci
          npm run build
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - name: Render all workspaces and verify interactions
        env:
          CHROME_PATH: /usr/bin/google-chrome
          UI_SCREENSHOT_DIR: ui-screenshots
        run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: UI-render-evidence
          path: ui-screenshots/*.png
          if-no-files-found: error
  release:
    needs: [native, ui-visual]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: MarkAllDown-*
          path: installers
      - name: Prepare checksums
        run: |
          mkdir -p release-assets
          find installers -type f -exec cp {} release-assets/ \;
          (cd release-assets && sha256sum * > SHA256SUMS.txt)
      - name: Create release only after all platforms pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          gh release create "$tag" --target "${{ github.sha }}" --latest=false --title "MarkAllDown $tag" --notes-file RELEASE_NOTES.md
          gh release upload "$tag" release-assets/*
