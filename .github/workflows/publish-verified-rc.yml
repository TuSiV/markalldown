name: Publish verified visual RC
on:
  push:
    branches: [feature/local-web-conversion]
    paths:
      - scripts/publish_prerelease.py
      - .github/workflows/publish-verified-rc.yml
permissions:
  contents: write
  actions: read
jobs:
  publish:
    if: contains(github.event.head_commit.message, '[publish-rc]')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify original source and native checks
        run: |
          python - <<'PY'
          import json, subprocess
          source = '444e104018f8633c6e6a929f20169c872e775cef'
          run = json.loads(subprocess.check_output(['gh','api','repos/TuSiV/markalldown/actions/runs/38687913146']))
          assert run['head_sha'] == source and run['head_branch'] == 'feature/local-web-conversion'
          changed = set(subprocess.check_output(['git','diff','--name-only',source,'HEAD'],text=True).splitlines())
          assert changed <= {'scripts/publish_prerelease.py','.github/workflows/publish-verified-rc.yml'}, 'Application inputs changed; rebuild required'
          jobs = json.loads(subprocess.check_output(['gh','api','repos/TuSiV/markalldown/actions/runs/38687913146/jobs?per_page=100']))['jobs']
          required = {'native (windows-2022, windows-x64)','native (macos-15, macos-arm64)','native (macos-15-intel, macos-x64)','ui-visual'}
          assert required <= {j['name'] for j in jobs if j['conclusion'] == 'success'}
          print('Original application source and all native/UI checks verified.')
          PY
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 38687913146
          pattern: MarkAllDown-*
          path: installers
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 38687913146
          name: UI-render-evidence
          path: ui-screenshots
      - name: Verify draft assets and publish
        run: python scripts/publish_prerelease.py --source-commit 444e104018f8633c6e6a929f20169c872e775cef
