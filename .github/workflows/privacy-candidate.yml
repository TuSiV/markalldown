name: Desktop and browser acceptance
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
env:
  ORT_DISABLE_TELEMETRY: "1"
permissions:
  contents: read
concurrency:
  group: desktop-browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            label: windows-x64
          - os: macos-15
            label: macos-arm64
          - os: macos-15-intel
            label: macos-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - name: Install dependencies
        run: |
          npm ci
          python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt pyinstaller psutil
      - name: Tests and frontend build
        env:
          MAD_PYTHON: python
        run: |
          python scripts/test_backend.py
          npm test
          npm run build
          npm audit --audit-level=high
      - name: Measure fresh 1/2/4-worker conversion throughput
        run: python scripts/benchmark_queue.py --output queue-benchmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: Queue-benchmark-${{ matrix.label }}
          path: queue-benchmark.json
      - name: Inspect previous macOS release signature and Gatekeeper
        if: runner.os == 'macOS'
        shell: bash
        run: |
          arch=x64
          if [ "${{ matrix.label }}" = "macos-arm64" ]; then arch=aarch64; fi
          curl --fail --location --retry 3 "https://github.com/TuSiV/markalldown/releases/download/v2.2.0/MarkAllDown_2.2.0_${arch}.dmg" -o "$RUNNER_TEMP/previous.dmg"
          hdiutil verify "$RUNNER_TEMP/previous.dmg"
          mount="$RUNNER_TEMP/previous-dmg"
          mkdir -p "$mount" macos-evidence
          hdiutil attach "$RUNNER_TEMP/previous.dmg" -nobrowse -mountpoint "$mount"
          ditto "$mount/MarkAllDown.app" "$RUNNER_TEMP/Previous-MarkAllDown.app"
          hdiutil detach "$mount"
          python scripts/check_macos_bundle.py "$RUNNER_TEMP/Previous-MarkAllDown.app" --inspect-only --quarantine --report "macos-evidence/previous-${{ matrix.label }}.json"
      - name: Native sidecar and installer build
        env:
          MAD_PRERELEASE: ${{ (contains(github.event.head_commit.message, '[stable-3.0.0]') || contains(github.event.head_commit.message, '[stable]')) && '0' || '1' }}
        run: python scripts/build.py --skip-install
      - name: Packaged sidecar smoke (Windows)
        if: runner.os == 'Windows'
        run: python scripts/smoke_service.py backend/dist/markalldown-server/markalldown-server.exe
      - name: Packaged sidecar smoke (macOS)
        if: runner.os == 'macOS'
        run: python scripts/smoke_service.py backend/dist/markalldown-server/markalldown-server
      - name: Measure packaged startup (Windows)
        if: runner.os == 'Windows'
        run: python scripts/benchmark_startup.py backend/dist/markalldown-server/markalldown-server.exe --output startup-benchmark.json
      - name: Measure packaged startup (macOS)
        if: runner.os == 'macOS'
        run: python scripts/benchmark_startup.py backend/dist/markalldown-server/markalldown-server --output startup-benchmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: Startup-benchmark-${{ matrix.label }}
          path: startup-benchmark.json
      - name: Install and smoke Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          $destination = Join-Path $env:RUNNER_TEMP 'MarkAllDown-installed'
          $process = Start-Process -FilePath $installer.FullName -ArgumentList '/S',"/D=$destination" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          $exe = Get-ChildItem $destination -Filter markalldown.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw 'Installed executable not found' }
          python scripts/smoke_desktop.py $exe.FullName
      - name: Install and smoke macOS DMG app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          dmg=$(find src-tauri/target/release/bundle/dmg -name '*.dmg' -print -quit)
          mount="$RUNNER_TEMP/markalldown-dmg"
          mkdir -p "$mount"
          hdiutil attach "$dmg" -nobrowse -mountpoint "$mount"
          ditto "$mount/MarkAllDown.app" "$RUNNER_TEMP/MarkAllDown.app"
          hdiutil detach "$mount"
          version=$(node -p "require('./package.json').version")
          python scripts/check_macos_bundle.py "$RUNNER_TEMP/MarkAllDown.app" --version "$version" --report "macos-evidence/current-${{ matrix.label }}.json"
          python scripts/smoke_desktop.py "$RUNNER_TEMP/MarkAllDown.app/Contents/MacOS/markalldown"
          python scripts/check_macos_bundle.py "$RUNNER_TEMP/MarkAllDown.app" --version "$version" --quarantine --report "macos-evidence/quarantined-${{ matrix.label }}.json"
      - name: Upload macOS signature and Gatekeeper evidence
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Mac-policy-${{ matrix.label }}
          path: macos-evidence/*.json
          if-no-files-found: warn
      - name: Upload installers and smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: MarkAllDown-${{ matrix.label }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
  ui-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Prepare UI rendering
        run: |
          npm ci
          npm run build
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - name: Render all workspaces and verify interactions
        env:
          CHROME_PATH: /usr/bin/google-chrome
          UI_SCREENSHOT_DIR: ui-screenshots
        run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: UI-render-evidence
          path: ui-screenshots/*.png
          if-no-files-found: error
  browser-acceptance:
    uses: ./.github/workflows/local-web.yml
  visual-prerelease:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[prerelease]')
    needs: [native, ui-visual, browser-acceptance]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: MarkAllDown-*
          path: installers
      - uses: actions/download-artifact@v4
        with:
          name: UI-render-evidence
          path: ui-screenshots
      - name: Verify assets and publish an explicit RC
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_prerelease.py

  stable-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && (contains(github.event.head_commit.message, '[stable-3.0.0]') || contains(github.event.head_commit.message, '[stable]'))
    needs: [native, ui-visual, browser-acceptance]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: MarkAllDown-*
          path: installers
      - uses: actions/download-artifact@v4
        with:
          name: UI-render-evidence
          path: ui-screenshots
      - name: Publish stable installers after full acceptance
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_stable.py
